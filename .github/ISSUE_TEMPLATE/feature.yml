name: Feature or improvement
description: A behaviour that is missing, or one that should be better
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do that the app makes hard today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you would like instead
    validations:
      required: true
  - type: textarea
    id: size
    attributes:
      label: Does this need a new dependency?
      description: The release binary has about 450 KB of headroom under the 7 MB budget, so this matters. Say which crate and how much it adds.
    validations:
      required: true
